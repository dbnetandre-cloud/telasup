<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal DBNET — Consulta de Clientes</title>
  <link rel="icon" type="image/png" href="favicon2.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shell.css" />
  <script>
    // Tema salvo, aplicado antes de pintar (evita flash)
    try {
      var t = localStorage.getItem('ideiaSupTema');
      document.documentElement.setAttribute('data-theme', ['dark','dim','light','sepia','green'].indexOf(t) >= 0 ? t : 'dark');
    } catch (_) { document.documentElement.setAttribute('data-theme', 'dark'); }
  </script>
</head>
<body class="shell">
  <!-- Barra de abas: cada aba é uma consulta independente (um iframe de app.html) -->
  <div class="tabbar" id="tabbar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="tab-new" id="tab-new" title="Nova busca (nova aba)" aria-label="Nova aba">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="tab-frames" id="tab-frames"></div>

  <script src="shell.js"></script>
</body>
</html>
